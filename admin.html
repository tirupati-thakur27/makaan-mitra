<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Panel — Makaan Mitra</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .navbar-premium { background: #0f172a; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-premium shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
            <i class="fa-solid fa-shield-halved text-warning"></i> Makaan Mitra — Admin Panel
        </a>
        <a href="index.html" class="btn btn-sm btn-outline-light rounded-pill">Back to Site</a>
    </div>
</nav>

<div class="container my-5">
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 border-start border-primary border-4">
                <small class="text-muted fw-bold">ACTIVE VERIFIED LISTINGS</small>
                <h2 id="totalListings" class="fw-bold mb-0 mt-1">0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 border-start border-success border-4">
                <small class="text-muted fw-bold">BROKERAGE SAVED (EST.)</small>
                <h2 id="brokerageSaved" class="fw-bold text-success mb-0 mt-1">₹0</h2>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm rounded-4 p-4 border-start border-warning border-4">
                <small class="text-muted fw-bold">DATABASE STATUS</small>
                <h5 class="fw-bold text-dark mb-0 mt-2"><i class="fa-solid fa-circle-check text-success me-1"></i>SQLite Live</h5>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm rounded-4 p-4">
        <h5 class="fw-bold mb-3">Property Security & Audit Table</h5>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Property Title</th>
                        <th>Area</th>
                        <th>Owner</th>
                        <th>Rent</th>
                        <th>Coordinates</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function loadAdminData() {
        const res = await fetch('/api/properties');
        const list = await res.json();

        document.getElementById('totalListings').innerText = list.length;
        const totalRent = list.reduce((sum, p) => sum + p.rent, 0);
        document.getElementById('brokerageSaved').innerText = `₹${totalRent.toLocaleString()}`;

        document.getElementById('adminTableBody').innerHTML = list.map(p => `
            <tr>
                <td>#${p.id}</td>
                <td class="fw-bold">${p.title}</td>
                <td>${p.area}</td>
                <td>${p.owner_name}</td>
                <td>₹${p.rent.toLocaleString()}</td>
                <td class="small text-muted">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</td>
                <td>
                    <button onclick="deleteListing(${p.id})" class="btn btn-sm btn-danger rounded-pill px-3">
                        <i class="fa-solid fa-trash me-1"></i>Remove
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function deleteListing(id) {
        if (!confirm('Remove this property listing from Makaan Mitra?')) return;
        const res = await fetch(`/api/properties/${id}`, { method: 'DELETE' });
        if (res.ok) loadAdminData();
    }

    loadAdminData();
</script>
</body>
</html>
