<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Property (Zero Brokerage) — Makaan Mitra</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .navbar-premium { background: #0f172a; }
        #pickerMap { height: 280px; border-radius: 12px; border: 2px solid #cbd5e1; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-premium shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
            <i class="fa-solid fa-arrow-left text-warning"></i> Makaan Mitra
        </a>
        <span class="navbar-text text-white small"><i class="fa-solid fa-circle-user me-1"></i> Landlord Console</span>
    </div>
</nav>

<div class="container my-5" style="max-width: 820px;">
    <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
        <h3 class="fw-bold mb-1">List Your Property for Free</h3>
        <p class="text-muted mb-4">Connect directly with verified students & working bachelors — 0% brokerage.</p>

        <form id="listPropertyForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Property / PG Title</label>
                    <input type="text" id="title" class="form-control" placeholder="e.g., Gokul Dham Bachelor PG" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Area / Locality</label>
                    <select id="area" class="form-select" required>
                        <option value="Kandivali East">Kandivali East</option>
                        <option value="Borivali West">Borivali West</option>
                        <option value="Andheri East">Andheri East</option>
                        <option value="Matunga">Matunga</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Full Landmark / Address</label>
                    <input type="text" id="landmark" class="form-control" placeholder="Near Thakur Village, Kandivali East" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Monthly Rent (₹)</label>
                    <input type="number" id="rent" class="form-control" placeholder="9500" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Accommodation Type</label>
                    <select id="property_type" class="form-select">
                        <option value="PG (Double Sharing)">PG (Double Sharing)</option>
                        <option value="1RK Studio">1RK Studio</option>
                        <option value="1BHK Shared">1BHK Shared</option>
                        <option value="Student Hostel">Student Hostel</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Owner Name</label>
                    <input type="text" id="owner_name" class="form-control" placeholder="Your Full Name" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Contact Number</label>
                    <input type="text" id="owner_phone" class="form-control" placeholder="+91 98XXXXXXXX" required>
                </div>

                <!-- Satellite Pin Picker -->
                <div class="col-12 mt-3">
                    <label class="form-label fw-semibold"><i class="fa-solid fa-satellite text-primary me-1"></i>Pin Exact Building Location on Satellite Map</label>
                    <div id="pickerMap"></div>
                    <small class="text-muted" id="coordDisplay">Click on the map to set exact coordinates (Default: Kandivali East)</small>
                    <input type="hidden" id="lat" value="19.2055">
                    <input type="hidden" id="lng" value="72.8715">
                </div>

                <div class="col-12 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold rounded-pill">
                        <i class="fa-solid fa-cloud-arrow-up me-2"></i>Publish Property Live
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('pickerMap').setView([19.2055, 72.8715], 14);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);

    let marker = L.marker([19.2055, 72.8715]).addTo(map);

    map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;
        document.getElementById('coordDisplay').innerText = `Selected Coordinates: ${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
    });

    document.getElementById('listPropertyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            title: document.getElementById('title').value,
            area: document.getElementById('area').value,
            landmark: document.getElementById('landmark').value,
            rent: parseInt(document.getElementById('rent').value),
            property_type: document.getElementById('property_type').value,
            owner_name: document.getElementById('owner_name').value,
            owner_phone: document.getElementById('owner_phone').value,
            lat: parseFloat(document.getElementById('lat').value),
            lng: parseFloat(document.getElementById('lng').value)
        };

        const res = await fetch('/api/properties', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (res.ok) {
            alert('✅ Property listed successfully! Redirecting to homepage...');
            window.location.href = 'index.html';
        } else {
            alert('❌ Error saving property.');
        }
    });
</script>
</body>
</html>
